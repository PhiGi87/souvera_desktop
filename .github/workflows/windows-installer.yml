name: Windows Installer (Souvera)
on:
  workflow_dispatch:
  push:
    branches:
      - souvera-branding
    paths:
      - 'src/**'
      - 'shell_integration/**'
      - 'theme/**'
      - 'admin/**'
      - 'CMakeLists.txt'
      - 'NEXTCLOUD.cmake'
      - 'config.h.in'
      - 'craftmaster.ini'
      - '.github/workflows/windows-installer.yml'
jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Craft Master with Nextcloud Client deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Install Inkscape (for icon rendering)
        shell: pwsh
        run: choco install inkscape -y

      - name: Install WiX Toolset (for MSI packaging)
        shell: pwsh
        run: |
          choco install wixtoolset -y
          "WIX=C:\Program Files (x86)\WiX Toolset v3.14" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Patch blueprint (Souvera branding + MSI)
        shell: pwsh
        run: |
          # The stable-34.0 nextcloud-client blueprint hardcodes the installer
          # identity to Nextcloud, independent of our NEXTCLOUD.cmake branding.
          # Rewrite it to Souvera and fix the missing `import os` in
          # createPackage(). Also enable BUILD_WIN_MSI so the repo's own WiX
          # MSI assets (product name, shortcuts, product icon, registry) are
          # built and installed into the Craft image directory.
          $bp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if (Test-Path $bp) {
              $c = Get-Content -Raw $bp
              if ($c -notmatch "(?m)^import os") { $c = "import os`r`n" + $c }
              $c = $c -replace 'self\.description = "Nextcloud Desktop Client"', 'self.description = "Souvera Workspace Desktop Client"'
              $c = $c -replace 'self\.displayName = "Nextcloud"', 'self.displayName = "Souvera Workspace"'
              $c = $c -replace 'self\.webpage = "https://nextcloud.com"', 'self.webpage = "https://souvera.work"'
              $c = $c -replace 'self\.defines\["appname"\] = "nextcloud"', ('self.defines["appname"] = "souvera"' + "`r`n        " + 'self.defines["productname"] = "Souvera Workspace"')
              $c = $c -replace 'self\.defines\["company"\] = "Nextcloud GmbH"', 'self.defines["company"] = "Host-On Service Provider GmbH"'
              $c = $c -replace 'self\.applicationExecutable = "nextcloud"', 'self.applicationExecutable = "souvera"'
              $c = $c -replace 'self\.subinfo\.options\.configure\.args \+= \[f"-DMIRALL_VERSION_SUFFIX=\{versionSuffix\}"\]', ('$0' + "`r`n        self.subinfo.options.configure.args += [""-DBUILD_WIN_MSI=ON"", ""-DCMAKE_INSTALL_PREFIX=/""]")
              [System.IO.File]::WriteAllText($bp, $c)
              Write-Host "== Patched blueprint =="
              Get-Content $bp | Select-String -Pattern 'displayName|appname|productname|company|applicationExecutable|BUILD_WIN_MSI|^import os'
          } else {
              Write-Host "WARNING: blueprint not found at $bp"
          }

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir ${{ github.workspace }} nextcloud-client

      - name: Build MSI installer
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          # Merge the app image with all runtime dependencies (Qt, etc.) into
          # the craft "archive" directory. This also produces an NSIS setup.exe
          # as a fallback installer.
          craft --package nextcloud-client

          # The merged, flattened tree lives in <target>\build\nextcloud-client\archive.
          $archive = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\archive"
          if (-not (Test-Path $archive)) { throw "Craft archive directory not found." }

          $msiDir = Join-Path $archive "msi"
          if (-not (Test-Path "$msiDir\make-msi.bat")) {
              throw "MSI assets missing in archive dir - BUILD_WIN_MSI patch did not apply?"
          }
          cmd /c "cd /d `"$msiDir`" && make-msi.bat `"$archive`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $msiDir -Filter *.msi | Format-Table Name,Length

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $archive = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\build\nextcloud-client\archive"
          $msiDir = Join-Path $archive "msi"

          $out = "${{ github.workspace }}\souvera-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $msi = Get-ChildItem $msiDir -Filter *.msi -ErrorAction SilentlyContinue
          foreach ($m in $msi) { Copy-Item $m.FullName -Destination $out -Force }

          if (-not (Get-ChildItem $out -Filter *.msi -ErrorAction SilentlyContinue)) {
              throw "No MSI installer was produced."
          }

          Write-Host "== Collected artifacts =="
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Souvera-Workspace-Windows
          path: souvera-artifacts/**
          if-no-files-found: warn
          retention-days: 14
