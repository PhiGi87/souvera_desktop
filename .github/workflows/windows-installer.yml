name: Windows Installer (Souvera)
on:
  workflow_dispatch:
  push:
    branches:
      - souvera-branding
    paths:
      - 'src/**'
      - 'theme/**'
      - 'admin/**'
      - 'CMakeLists.txt'
      - 'NEXTCLOUD.cmake'
      - 'config.h.in'
      - 'craftmaster.ini'
      - '.github/workflows/windows-installer.yml'
jobs:
  build:
    name: Build Windows installer
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install Craft Master with Nextcloud Client deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|stable-34.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Install Inkscape (for icon rendering)
        shell: pwsh
        run: choco install inkscape -y

      - name: Setup PATH
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --src-dir ${{ github.workspace }} nextcloud-client

      - name: Package installer (NSIS)
        id: package
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          # The stable-34.0 nextcloud-client blueprint hardcodes the installer
          # identity (product name, install dir, shortcuts, executable, company)
          # to Nextcloud, independent of our NEXTCLOUD.cmake source branding.
          # Rewrite it to Souvera so the installer installs alongside Nextcloud
          # and is fully branded. Also fixes an upstream bug where createPackage()
          # uses os.path.join without importing os.
          $bp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py"
          if (Test-Path $bp) {
              $c = Get-Content -Raw $bp
              if ($c -notmatch "(?m)^import os") { $c = "import os`r`n" + $c }
              $c = $c -replace 'self\.description = "Nextcloud Desktop Client"', 'self.description = "Souvera Workspace Desktop Client"'
              $c = $c -replace 'self\.displayName = "Nextcloud"', 'self.displayName = "Souvera Workspace"'
              $c = $c -replace 'self\.webpage = "https://nextcloud.com"', 'self.webpage = "https://souvera.work"'
              $c = $c -replace 'self\.defines\["appname"\] = "nextcloud"', ('self.defines["appname"] = "souvera"' + "`r`n        " + 'self.defines["productname"] = "Souvera Workspace"')
              $c = $c -replace 'self\.defines\["company"\] = "Nextcloud GmbH"', 'self.defines["company"] = "Host-On Service Provider GmbH"'
              $c = $c -replace 'self\.applicationExecutable = "nextcloud"', 'self.applicationExecutable = "souvera"'
              [System.IO.File]::WriteAllText($bp, $c)
              Write-Host "== Patched blueprint =="
              Get-Content $bp | Select-String -Pattern 'displayName|appname|productname|company|applicationExecutable|^import os'
          } else {
              Write-Host "WARNING: blueprint not found at $bp"
          }

          craft --package nextcloud-client

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $out = "${{ github.workspace }}\souvera-artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # 1) NSIS installer produced by `craft --package`. Match setup executables
          #    only, and exclude Craft's download/cache/build trees so we don't drag
          #    in dependency .7z archives.
          $pkgs = Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include *setup*.exe,*Setup*.exe,nextcloud-*.exe,souvera-*.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch "\\(build|download|cache|dev-utils|msys)\\" -and $_.Length -gt 1MB }
          foreach ($p in $pkgs) { Copy-Item $p.FullName -Destination $out -Force }

          if (-not (Get-ChildItem $out -Filter *.exe -ErrorAction SilentlyContinue)) {
              throw "No NSIS installer was produced by craft --package."
          }

          Write-Host "== Collected artifacts =="
          Get-ChildItem $out | Format-Table Name,Length

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Souvera-Workspace-Windows
          path: souvera-artifacts/**
          if-no-files-found: warn
          retention-days: 14
